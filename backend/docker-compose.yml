version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: sylvie-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: sylvie-redis
    restart: always
    ports:
      - "6379:6379"
