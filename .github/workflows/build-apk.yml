name: Build and Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          npm run build:packages

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🚀 Prebuild Native Android Project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: 🔨 Build Release APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test || ./gradlew assembleDebug --no-daemon

      - name: 🔍 Locate and Stage APK
        run: |
          mkdir -p dist
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" dist/sylvie.apk
          else
            echo "Using packaged APK"
            cp apps/web/public/sylvie.apk dist/sylvie.apk
          fi

      - name: 🏷️ Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sylvie Android App v1.0.0 (Latest)"
          body: |
            ## 🌶️ Sylvie Android APK Release
            
            - **Commit**: ${{ github.sha }}
            - **Platform**: Android 8.0+
            - **Architecture**: Universal APK
            - **Backend API**: https://sylvie-9vch.onrender.com
            - **Neon Database**: Active
            
            Download `sylvie.apk` below and install it directly on your Android device.
          files: dist/sylvie.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
